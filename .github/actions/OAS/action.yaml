name: "Update branch reference"
description: "Validate the branch name and update the OAS branch reference"

runs:
  using: "composite"

  steps:
    # Keep .github/tmp/branch.txt synchronized with the current branch.
    #
    # The repository has already been checked out by the parent workflow,
    # so this composite action does not need to run actions/checkout again.
    #
    # If the branch reference changes, commit it and push it back to the
    # current branch using the credentials persisted by actions/checkout.
    - name: Update branch reference if needed
      shell: bash
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail

        BRANCH_FILE=".github/tmp/branch.txt"

        mkdir -p "$(dirname "$BRANCH_FILE")"

        # Stop here if the branch reference is already correct.
        if [[ -f "$BRANCH_FILE" ]] && [[ "$(cat "$BRANCH_FILE")" == "$BRANCH_NAME" ]]; then
          echo "Branch reference is already up to date."
          exit 0
        fi

        echo "Updating branch reference to: $BRANCH_NAME"

        printf '%s\n' "$BRANCH_NAME" > "$BRANCH_FILE"

        # Configure the GitHub Actions bot as the commit author.
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add "$BRANCH_FILE"

        # Safety check: do not try to commit if nothing actually changed.
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "chore: update branch reference"

        # Push the new commit to the source branch of the Pull Request.
        git push origin "HEAD:$BRANCH_NAME"

        echo "Branch reference updated successfully."
