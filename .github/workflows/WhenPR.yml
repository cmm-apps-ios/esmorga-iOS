name: Run iOS Tests on PR

run-name: ${{ github.actor }} is testing PR ${{ github.ref_name }} new code 🚀

on:
  # Run automatically when a Pull Request targeting one of these branches changes.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - 'release/release*'

  # Allow the workflow to be started manually from the GitHub Actions UI.
  workflow_dispatch:

# Grant only the permissions required by this workflow.
# "contents: write" is required because the OAS action may commit and push
# the generated branch reference back to the PR branch.
permissions:
  contents: write

jobs:
  ios-tests:
    name: Run iOS Tests

    # Use GitHub's current macOS 15 hosted runner.
    runs-on: macos-15

    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT
      # -----------------------------------------------------------------------
      # Download the repository into the runner.
      #
      # LFS is enabled because the repository may contain files managed by
      # Git Large File Storage.
      #
      # github.head_ref contains the source branch for Pull Requests.
      # github.ref_name is used as a fallback for manually triggered workflows.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref_name }}

      # -----------------------------------------------------------------------
      # 2. OAS / BRANCH REFERENCE
      # -----------------------------------------------------------------------
      # Run our local composite action.
      #
      # The action validates the branch naming convention and updates
      # .github/tmp/branch.txt when necessary.
      #
      # Authentication for git push comes from the GITHUB_TOKEN credentials
      # persisted by actions/checkout, so E2E_GITHUB_TOKEN is no longer needed.
      - name: Update branch reference
        uses: ./.github/actions/OAS

      # -----------------------------------------------------------------------
      # 3. INSTALL APPLE SIGNING ASSETS
      # -----------------------------------------------------------------------
      # Decode the Apple signing certificate and provisioning profile stored
      # as GitHub Secrets.
      #
      # A temporary macOS keychain is created so Xcode can access the signing
      # certificate without installing it permanently on the runner.
      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |
          set -euo pipefail

          # Store all temporary signing files inside RUNNER_TEMP.
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the Base64 certificate stored in GitHub Secrets.
          echo -n "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode -o "$CERTIFICATE_PATH"

          # Decode the Base64 provisioning profile stored in GitHub Secrets.
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode -o "$PROFILE_PATH"

          # Create a temporary keychain used only for this workflow run.
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Keep the temporary keychain unlocked for up to 6 hours.
          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          # Unlock the temporary keychain.
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Import the Apple signing certificate into the temporary keychain.
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow Apple signing tools such as codesign and Xcode to access
          # the private key without an interactive password prompt.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Make the temporary keychain available to the current user.
          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          # Install the provisioning profile where Xcode expects to find it.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision"

      # -----------------------------------------------------------------------
      # 4. RUN iOS TESTS
      # -----------------------------------------------------------------------
      # Execute the project's XCTest suite on the latest available
      # iPhone 16 simulator.
      #
      # set -o pipefail ensures failures from xcodebuild propagate correctly
      # if commands are piped in the future.
      - name: Run Tests
        run: |
          set -o pipefail

          xcodebuild test \
            -scheme EsmorgaiOS \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            ONLY_ACTIVE_ARCH=YES \
            -resultBundlePath TestResults.xcresult

      # -----------------------------------------------------------------------
      # 5. UPLOAD TEST RESULTS ON FAILURE
      # -----------------------------------------------------------------------
      # Preserve the xcresult bundle when tests fail so it can be downloaded
      # from GitHub Actions and inspected locally with Xcode.
      #
      # This step runs only when a previous step has failed.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

      # -----------------------------------------------------------------------
      # 6. CLEANUP
      # -----------------------------------------------------------------------
      # Always remove signing material, even when checkout, signing, or tests
      # fail.
      #
      # Existence checks and "rm -f" prevent cleanup errors from hiding the
      # original workflow failure.
      - name: Clean up signing assets
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision"

          # Delete the temporary keychain only if it was successfully created.
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          # Remove all temporary Apple signing files.
          rm -f "$PROFILE_PATH"
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
